# AbleOps SDK — 독립 저장소 CI
#
# 검증 규칙은 scripts/verify.sh 에만 있다. 이 워크플로는 Go 를 설치하고 `verify.sh full` 을 부를 뿐이다 —
# 로컬 `bash scripts/verify.sh full` 통과가 곧 CI 통과여야 하고, 게이트 목록이 두 곳에 있으면 한쪽이 조용히 어긋난다.
#
# ⚠ Core 저장소(ableops-kafka)의 sdk/ 스테이징 안에서는 아무것도 하지 않는다. GitHub Actions 는 저장소 **루트**의
#   .github/workflows 만 읽으므로, 이 저장소가 루트가 되는 순간 활성화된다
#   (추출 절차는 Core 저장소의 docs/reference_docs/extension-sdk/12-SDK저장소분리.md §4).
#   Core 안에서 재현하려면 `cd sdk && GOWORK=off bash scripts/verify.sh full`.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: SDK 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Core 와 같은 정확 버전으로 고정한다(자동추종을 버린 교환 — 올릴 때 손으로 올린다).
          go-version: "1.27.1"
          cache: true
      # 외부 consumer 검증(TestExternalConsumerCompiles)은 GOPROXY=off 로 모듈 캐시만 쓴다 — 먼저 채워 둔다.
      - name: 의존성 내려받기
        run: go mod download
      - name: 검증(full) — gofmt · build · vet · test · 경계 게이트 · 예제 빌드 · 의존성 최소성
        run: bash scripts/verify.sh full
